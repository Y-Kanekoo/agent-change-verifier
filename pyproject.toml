[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-change-verifier"
version = "0.1.0"
description = "AI コーディングエージェントの変更と受け入れ条件を検証する CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
agent-change-verifier = "agent_change_verifier.cli:main"
acv = "agent_change_verifier.cli:main"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8", "pytest-cov>=6", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_change_verifier --cov-report=term-missing --cov-fail-under=85"
